<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Format Converter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b1020; color: #e2e8f0; font-family: -apple-system, sans-serif; padding: 20px; min-height: 100vh; }
h2 { font-size: 18px; margin-bottom: 16px; color: #60a5fa; }
label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
textarea {
    width: 100%; background: rgba(8,13,26,0.8); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; color: #e2e8f0; font-size: 12px; font-family: monospace;
    padding: 12px; resize: vertical; outline: none;
}
button {
    width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #06b6d4); color: white;
}
.copy-btn { background: #22c55e; margin-top: 8px; }
.count { font-size: 12px; color: #94a3b8; margin-top: 6px; }
</style>
</head>
<body>
<h2>🔄 Proxy Format Converter</h2>

<label>Paste Webshare proxy list (any format):</label>
<textarea id="input" rows="10" placeholder="p.webshare.io:80:vqleyfyj-IN-1:ejerrihypib3&#10;OR&#10;vqleyfyj-IN-1:ejerrihypib3:p.webshare.io:80"></textarea>

<button onclick="convert()">Convert →</button>

<div style="margin-top:16px;">
<label>Converted (ready to paste in Settings):</label>
<textarea id="output" rows="10" readonly placeholder="Output will appear here..."></textarea>
<div class="count" id="count"></div>
<button class="copy-btn" onclick="copyOutput()">📋 Copy All</button>
</div>

<script>
function convert() {
    const lines = document.getElementById('input').value.split('\n').map(l => l.trim()).filter(Boolean);
    const results = [];

    for (const line of lines) {
        const parts = line.split(':');
        if (parts.length < 4) continue;

        let host, port, user, pass;

        // Format: host:port:user:pass
        if (parts[0].includes('.') && !isNaN(parts[1])) {
            [host, port, user, pass] = parts;
        }
        // Format: user:pass:host:port
        else if (parts[2].includes('.') && !isNaN(parts[3])) {
            [user, pass, host, port] = parts;
        }
        // Format: user:pass@host:port (already correct)
        else if (line.includes('@')) {
            results.push(line.startsWith('http') ? line : 'http://' + line);
            continue;
        } else continue;

        if (host && port && user && pass) {
            results.push(`http://${user}:${pass}@${host}:${port}`);
        }
    }

    document.getElementById('output').value = results.join('\n');
    document.getElementById('count').textContent = `${results.length} proxies converted`;
}

function copyOutput() {
    const out = document.getElementById('output');
    out.select();
    document.execCommand('copy');
    const btn = event.target;
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = '📋 Copy All', 2000);
}
</script>
</body>
</html>
